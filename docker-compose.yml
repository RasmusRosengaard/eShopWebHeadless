version: '3.4'

services:
  eshopwebspa:
    image: ${DOCKER_REGISTRY-}eshopwebspa
    build:
      context: .
      dockerfile: src/WebSpa/Dockerfile
    depends_on:
      - "eshoppublicapi"
      - "reverseproxy"
  eshopblazoradmin:
    image: ${DOCKER_REGISTRY-}eshopblazoradmin
    build:
      context: .
      dockerfile: src/BlazorAdmin/Dockerfile
    depends_on:
      - "eshoppublicapi"
      - "reverseproxy"
  eshoppublicapi:
    image: ${DOCKER_REGISTRY-}eshoppublicapi
    build:
      context: .
      dockerfile: src/PublicApi/Dockerfile
    depends_on:
      - "sqlserver"
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    ports:
      - "1433:1433"
    environment:
      - SA_PASSWORD=@someThingComplicated1234
      - ACCEPT_EULA=Y
  reverseproxy:
    image: ${DOCKER_REGISTRY-}reverseproxy
    build:
      context: .
      dockerfile: services/ReverseProxy/ReverseProxy.Api/Dockerfile
    depends_on:
      - "eshoppublicapi"
      - "catalogservice"
  catalogservice:
    image: ${DOCKER_REGISTRY-}catalogservice
    build:
      context: .
      dockerfile: services/CatalogService/CatalogService.Api/Dockerfile
    depends_on:
      catalogdb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: on-failure
  catalogdb:
    image: postgres:17
    environment:
      - POSTGRES_USER=catalog
      - POSTGRES_PASSWORD=catalogpassword
      - POSTGRES_DB=catalogdb
    ports:
      - "5433:5432"
  rabbitmq:
    image: rabbitmq:4-management
    # Durable køer og persistent beskeder skrives til disk. Uden en volume ligger den disk i containeren
    # og slettes, når containeren genskabes, så beskeder, der venter på en consumer, går tabt.
    # Fast hostname, fordi RabbitMQ gemmer sine data i en mappe opkaldt efter værtsnavnet.
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=catalog
      - RABBITMQ_DEFAULT_PASS=catalogpassword
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:

