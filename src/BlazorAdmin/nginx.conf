# Serves the published Blazor WebAssembly app as static files.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Makes Blazor load appsettings.Docker.json
    add_header Blazor-Environment Docker;

    location / {
        # SPA routing: unknown paths fall back to index.html
        try_files $uri $uri/ /index.html =404;
    }
}
