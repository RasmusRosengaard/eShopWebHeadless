<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin - Catalog - Microsoft.eShopOnWeb</title>
    <base href="/" />
    <!-- Moved from Web/Pages/Admin/Index.cshtml: BlazorAdmin is now served standalone instead of hosted by Web -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/admin.css" rel="stylesheet" />
    <script src="_content/BlazorInputFile/inputfile.js"></script>
    <script>

        window.getCookie = (cname) => {
            var name = cname + "=";
            var decodedCookie = decodeURIComponent(document.cookie);
            var ca = decodedCookie.split(';');
            for (var i = 0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0) == ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(name) == 0) {
                    return c.substring(name.length, c.length);
                }
            }

            return "";
        };

        window.deleteCookie = (cname) => {
            document.cookie = cname + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        };

        window.routeOutside = (path) => {
            window.location = path;
        };

        window.hideBodyOverflow = () => {
            document.body.classList.add("body-no-overflow");
        };

        window.showBodyOverflow = () => {
            document.body.classList.remove("body-no-overflow");
        };

    </script>
</head>
<body>
    <div id="admin">Loading...</div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
