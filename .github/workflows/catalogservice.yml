name: CatalogService

on:
  push:
    branches: [main]
    paths:
      - 'services/CatalogService/**'
      - '.github/workflows/catalogservice.yml'
  pull_request:
    paths:
      - 'services/CatalogService/**'
      - '.github/workflows/catalogservice.yml'
jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    with:
      service: CatalogService
      image: catalogservice # det navn som imaget får bagefter build
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
