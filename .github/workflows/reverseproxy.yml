name: ReverseProxy

on:
  push:
    branches: [main]
    paths:
      - 'services/reverseproxy/**'
      - '.github/workflows/reverseproxy.yml'
jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    with:
      service: ReverseProxy
      image: reverseproxy # det navn som imaget får bagefter build
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
